name: smart_operator_assistant
description: Smart Operator Assistant for CAT machinery — phone-first operator companion.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking (FastAPI client)
  dio: ^5.6.0

  # Charts (owner dashboard, training progress)
  fl_chart: ^0.69.0

  # Typography
  google_fonts: ^6.2.1

  # --- Dependencies below need platform-specific setup before enabling ---
  # TODO(P4): Firebase — needs GoogleService-Info.plist (iOS) + google-services.json (Android)
  # firebase_core: ^3.3.0
  # firebase_auth: ^5.1.4
  # cloud_firestore: ^5.2.1
  # firebase_storage: ^12.1.3
  # firebase_messaging: ^15.0.4

  # TODO(P4): Local / offline — Isar needs native build config
  # isar: ^3.1.0
  # isar_flutter_libs: ^3.1.0
  # connectivity_plus: ^6.0.5

  # TODO(P4): Sensors & safety — needs Info.plist permissions
  camera: ^0.11.0
  # sensors_plus: ^6.0.1
  # flutter_blue_plus: ^1.32.12
  # flutter_nearby_connections: ^1.1.2
  # geolocator: ^13.0.1
  # permission_handler: ^11.3.1

  # TODO(P4): Voice — needs native audio setup
  # sherpa_onnx: ^1.10.0
  # flutter_tts: ^4.0.2

  # TODO(P3): AR — needs Unity export in ios/UnityLibrary + android/unityLibrary
  # flutter_unity_widget: ^2022.2.1

  # TODO(P4): Maps — needs Google Maps API key in platform config
  # google_maps_flutter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # TODO(P4): Isar codegen
  # isar_generator: ^3.1.0
  # build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/

# NOTE: versions are indicative starting points — run `flutter pub get` and resolve to
# the latest compatible set during Phase 0.
