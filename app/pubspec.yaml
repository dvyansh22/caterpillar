name: smart_operator_assistant
description: Smart Operator Assistant for CAT machinery — phone-first operator companion.
publish_to: "none"
version: 0.1.4+5

environment:
  sdk: ">=3.4.0 <4.0.0"

# NOTE: This is the lean, web-runnable dependency set for the app shell + P4 flow.
# Heavier native packages are added per-feature as they land (documented in README.md):
#   firebase_* (auth/db/storage/push), flutter_blue_plus + flutter_nearby_connections (SOS/proximity),
#   camera + sensors_plus (safety), sherpa_onnx + flutter_tts (voice), flutter_unity_widget (AR),
#   google_maps_flutter, fl_chart, isar, dio.

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  dio: ^5.11.1
  camera: ^0.12.1
  speech_to_text: ^7.5.0
  sherpa_onnx: ^1.13.8
  record: ^7.1.1
  path_provider: ^2.1.6
  shared_preferences: ^2.3.2 # persist the operator session across app restarts

  # Night Shift design system: Oswald/Inter/JetBrains Mono via google_fonts,
  # fl_chart for the dashboard idle chart. Icons use Material outlined symbols.
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
